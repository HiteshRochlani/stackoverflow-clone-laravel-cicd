# This file is just an example to copy paste nginx config on the host machine if lost

server {
    listen 80;
    server_name server2.in;
    location / {
        proxy_pass http://0.0.0.0:9080;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forward-For $proxy_add_x_forwaded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
    }
}